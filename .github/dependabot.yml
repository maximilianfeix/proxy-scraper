version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Python dependencies – this entry also picks up bot/requirements.txt – grouped into one PR a week
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
  # the base image is pinned by digest (reproducible builds) – this keeps the digest current, so security fixes
  # in python:3.12-slim still arrive weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
