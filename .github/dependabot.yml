version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Python dependencies – this entry also picks up bot/requirements.txt – grouped into one PR a week
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
