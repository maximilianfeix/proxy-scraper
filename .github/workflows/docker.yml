name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "proxyscraper/**", ".github/workflows/docker.yml",
            ".github/scripts/mcp_smoke.py", ".github/scripts/lab_smoke.py", "tests/lab.py", "tests/data/**"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # uv with Python 3.12, pinned by digest
  UV_IMAGE: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: proxy-scraper:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm proxy-scraper:test --version
          docker run --rm proxy-scraper:test --list-sources 3
      - name: MCP server over stdio (what Docker's MCP catalog and Glama start)
        timeout-minutes: 3
        run: python .github/scripts/mcp_smoke.py docker run -i --rm proxy-scraper:test --mcp
      - name: MCP server from a plain uv sync (how Glama builds it, #303)
        timeout-minutes: 5
        run: |
          python .github/scripts/mcp_smoke.py docker run -i --rm -v "$PWD:/src:ro" "$UV_IMAGE" \
            sh -c 'cp -r /src /app && cd /app && uv sync --quiet && exec uv run --quiet proxy-scraper-mcp'
      # a pull request must not depend on public proxies being up: the checks run against the localhost lab
      # (tests/lab.py) with the container's own installation. The real scan with volumes runs in live-smoke.yml
      - name: The command line inside the container against the localhost lab
        timeout-minutes: 3
        run: |
          docker run --rm -e PROXY_SCRAPER_SMOKE_INSTALLED=1 -v "$PWD:/src:ro" --entrypoint python \
            proxy-scraper:test /src/.github/scripts/lab_smoke.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Build for arm64 too (what the release publishes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
