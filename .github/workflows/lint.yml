name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Version gepinnt, damit lokal und in der CI dieselben Regeln gelten
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format=github .
