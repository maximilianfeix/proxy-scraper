name: proxy list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write            # to push to the proxy-list branch

concurrency:
  group: proxy-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COLUMNS: "110"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # learned source statistics and history from the last run – the tool keeps learning here too
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: proxy-data-${{ github.run_id }}
          restore-keys: proxy-data-

      - name: Collect and check proxies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for the GitHub discovery
        run: python proxy_scraper.py -y --limit 150000 --timeout 6 --connect-timeout 3

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: data
          key: proxy-data-${{ github.run_id }}

      - name: Prepare the list
        id: prepare
        run: |
          # history of the last runs (chart) and how long each proxy has been listed (stable proxies).
          # 404 means: doesn't exist yet (first run). Any other error: better not publish this time
          # than lose the history.
          for f in history.json streaks.json; do
            code=$(curl -sL --retry 3 --retry-all-errors -o "$f" -w "%{http_code}" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/proxy-list/$f" || echo 000)
            if [ "$code" = "404" ]; then rm -f "$f"; elif [ "$code" != "200" ]; then
              echo "::warning::$f could not be loaded (HTTP $code) – the old list stays online"
              echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          if python -m proxyscraper.publish "results/$(cat results/latest.txt)" public --min 20 \
              --history history.json --streaks streaks.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 78 ] || exit "$rc"   # 78 = too few hits, the old list stays
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the proxy-list branch
        if: steps.prepare.outputs.publish == 'true'
        working-directory: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b proxy-list
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Proxy list of $(date -u +'%Y-%m-%d %H:%M UTC')"
          # a single commit that gets replaced every time – the history doesn't grow
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" proxy-list
