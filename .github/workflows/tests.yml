name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      # Startet das Programm einmal richtig – fängt Import-Fehler ab, die Tests nicht sehen
      - run: python proxy_scraper.py --help
      - run: python proxy_scraper.py --list-sources 5

  package:
    # Baut Wheel + sdist und installiert das Wheel frisch – so wie Nutzer es mit pipx bekommen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Run the installed command outside the repo
        working-directory: /tmp
        run: |
          /tmp/clean/bin/proxy-scraper --version
          /tmp/clean/bin/proxy-scraper --help > /dev/null
          /tmp/clean/bin/proxy-scraper --list-sources 3
