name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      # hash-locked; the MCP server's SDK comes only on 3.10+ – on 3.9 its tests skip
      - run: pip install -r .github/requirements/test.txt
      - run: python -m pytest -q
      # starts the program once for real – catches import errors the tests don't see
      - run: python proxy_scraper.py --help
      - run: python proxy_scraper.py --list-sources 5

  action:
    # the GitHub Action the way others use it (uses: maximilianfeix/proxy-scraper@v1), on every OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: proxies
        uses: ./
        with:
          types: socks5,http
          https: "true"
          limit: "5"
      - name: The outputs are there
        shell: bash
        run: |
          echo "count=${{ steps.proxies.outputs.count }} fastest=${{ steps.proxies.outputs.proxy }}"
          test "${{ steps.proxies.outputs.count }}" -ge 1
          test -s "${{ steps.proxies.outputs.file }}"
          head -3 "${{ steps.proxies.outputs.file }}"

  package:
    # builds wheel + sdist and installs the wheel fresh – the way users get it with pipx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install -r .github/requirements/test.txt
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Run the installed command outside the repo
        working-directory: /tmp
        run: |
          /tmp/clean/bin/proxy-scraper --version
          /tmp/clean/bin/proxy-scraper --help > /dev/null
          /tmp/clean/bin/proxy-scraper --list-sources 3
      - name: Install the MCP extra and talk to the installed server over stdio
        working-directory: /tmp
        run: |
          /tmp/clean/bin/pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)[mcp]"
          /tmp/clean/bin/python - <<'PY'
          import anyio
          from mcp.client.client import Client
          from mcp.client.stdio import StdioServerParameters

          async def main():
              async with Client(StdioServerParameters(command="/tmp/clean/bin/proxy-scraper-mcp")) as client:
                  names = sorted(t.name for t in (await client.list_tools()).tools)
                  assert names == ["check_proxies", "fetch_url", "get_proxies"], names
                  print("MCP tools:", names)

          anyio.run(main)
          PY
