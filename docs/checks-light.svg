<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-label="Every proxy passed five checks: 700+ lists, a real handshake, two sites with one IP, nothing injected, and the details.">
  <style>
    .route { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.8s cubic-bezier(.16,1,.3,1) .1s forwards; }
    .gate { animation: fade .6s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .gate { animation: none; } .route { animation: none; stroke-dashoffset: 0; } }
  </style>
  <defs><clipPath id="frame"><rect width="1280" height="290" rx="24"/></clipPath></defs>
  <g clip-path="url(#frame)"><rect width="1280" height="290" fill="#EFEFEC"/></g>
  <path d="M20 160 C 38.0 158.3 67.3 160.7 128 150 C 188.7 139.3 298.7 94.7 384 96 C 469.3 97.3 554.7 157.3 640 158 C 725.3 158.7 810.7 103.0 896 100 C 981.3 97.0 1091.3 137.0 1152 140 C 1212.7 143.0 1242.0 121.7 1260 118" fill="none" stroke="#DAD9D4" stroke-width="2"/>
  <path class="route" pathLength="100" d="M20 160 C 38.0 158.3 67.3 160.7 128 150 C 188.7 139.3 298.7 94.7 384 96 C 469.3 97.3 554.7 157.3 640 158 C 725.3 158.7 810.7 103.0 896 100 C 981.3 97.0 1091.3 137.0 1152 140 C 1212.7 143.0 1242.0 121.7 1260 118" fill="none" stroke="#3F5A00" stroke-width="3" stroke-linecap="round"/>
  
    <g class="gate" style="animation-delay:0.3s">
      <circle cx="128" cy="150" r="11" fill="#D4F77A" stroke="#3F5A00" stroke-width="2"/>
      <text x="128" y="126" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">step 1</text>
      <text x="128" y="204" text-anchor="middle" fill="#121113" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.4">700+ lists</text>
      <text x="128" y="226" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">read every 6 hours,</text><text x="128" y="246" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">most entries are dead</text>
    </g>
    <g class="gate" style="animation-delay:0.5s">
      <circle cx="384" cy="96" r="11" fill="#D4F77A" stroke="#3F5A00" stroke-width="2"/>
      <text x="384" y="72" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">step 2</text>
      <text x="384" y="204" text-anchor="middle" fill="#121113" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.4">A real handshake</text>
      <text x="384" y="226" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">HTTP, SOCKS4 or SOCKS5,</text><text x="384" y="246" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">not just an open port</text>
    </g>
    <g class="gate" style="animation-delay:0.7s">
      <circle cx="640" cy="158" r="11" fill="#D4F77A" stroke="#3F5A00" stroke-width="2"/>
      <text x="640" y="134" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">step 3</text>
      <text x="640" y="204" text-anchor="middle" fill="#121113" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.4">Two sites, one IP</text>
      <text x="640" y="226" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">honeypots that fake a</text><text x="640" y="246" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">response drop out</text>
    </g>
    <g class="gate" style="animation-delay:0.9s">
      <circle cx="896" cy="100" r="11" fill="#D4F77A" stroke="#3F5A00" stroke-width="2"/>
      <text x="896" y="76" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">step 4</text>
      <text x="896" y="204" text-anchor="middle" fill="#121113" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.4">Nothing injected</text>
      <text x="896" y="226" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">a static page has to</text><text x="896" y="246" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">arrive byte for byte</text>
    </g>
    <g class="gate" style="animation-delay:1.1s">
      <circle cx="1152" cy="140" r="11" fill="#D4F77A" stroke="#3F5A00" stroke-width="2"/>
      <text x="1152" y="116" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">step 5</text>
      <text x="1152" y="204" text-anchor="middle" fill="#121113" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.4">The details</text>
      <text x="1152" y="226" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">HTTPS with verified TLS,</text><text x="1152" y="246" text-anchor="middle" fill="#5F5C66" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">anonymity, country, provider</text>
    </g>
</svg>
