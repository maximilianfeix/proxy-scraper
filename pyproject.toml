[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-scraper"
dynamic = ["version"]
description = "Finds free HTTP, SOCKS4 and SOCKS5 proxies that actually work: 700+ sources, real checks, honeypot filtering and a rotating local proxy server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maximilian Feix" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "certifi"]
keywords = ["proxy", "proxy-list", "proxy-checker", "proxy-scraper", "socks5", "socks4", "http-proxy", "rotating-proxy", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
fast = ["uvloop; sys_platform != 'win32'"]
dev = ["pytest", "ruff==0.16.8"]

[project.scripts]
proxy-scraper = "proxyscraper.cli:run"

[project.urls]
Homepage = "https://github.com/maximilianfeix/proxy-scraper"
Issues = "https://github.com/maximilianfeix/proxy-scraper/issues"
Changelog = "https://github.com/maximilianfeix/proxy-scraper/releases"
"Live proxy list" = "https://github.com/maximilianfeix/proxy-scraper/tree/proxy-list"

[tool.setuptools.dynamic]
version = { attr = "proxyscraper.__version__" }

[tool.setuptools.packages.find]
include = ["proxyscraper*"]

[tool.setuptools.package-data]
proxyscraper = ["sources.json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Fehler, Warnungen, Bugbear (echte Fallstricke) und sortierte Importe
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["proxyscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
